name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Scan and clean the example workbook
        shell: bash
        run: |
          status=0
          excel-link-finder scan examples/sales-report.xlsx --json -o scan.json || status=$?
          test "$status" -eq 1   # 1 = external links found
          status=0
          excel-link-finder clean examples/sales-report.xlsx -o "$RUNNER_TEMP/sales-report_clean.xlsx" || status=$?
          test "$status" -eq 1   # 1 = the pivot table source is left for Excel
          excel-link-finder scan "$RUNNER_TEMP/sales-report_clean.xlsx" --quiet --no-check || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .
